apiVersion: apps/v1
kind: Deployment
metadata:
  name: stiction-api
  labels:
    app: stiction-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: stiction-api

  template:
    metadata:
      labels:
        app: stiction-api

    spec:
      containers:
        - name: stiction-api
          image: stiction-deep-coral-api:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
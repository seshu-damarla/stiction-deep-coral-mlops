name: Deploy to Local Kubernetes

on:
  workflow_run:
    workflows: ["CD - Publish Images"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: local-kubernetes-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare image tags
        shell: pwsh
        run: |
          $owner = "${{ github.repository_owner }}".ToLower()
          $sha = "${{ github.event.workflow_run.head_sha }}"
          $shortSha = $sha.Substring(0, 7)

          "SHORT_SHA=$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "API_IMAGE=ghcr.io/$owner/stiction-deep-coral-api:sha-$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FRONTEND_IMAGE=ghcr.io/$owner/stiction-deep-coral-frontend:sha-$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Deploying commit: $sha"
          Write-Host "Image tag: sha-$shortSha"

      - name: Verify Kubernetes access
        shell: pwsh
        run: |
          Write-Host "kubectl location:"
          where.exe kubectl

          Write-Host "Current Kubernetes context:"
          kubectl config current-context

          Write-Host "Cluster nodes:"
          kubectl get nodes

          Write-Host "Current deployments:"
          kubectl get deployments

      - name: Deploy FastAPI image
        shell: pwsh
        run: |
          Write-Host "Deploying $env:API_IMAGE"
          kubectl set image deployment/stiction-api stiction-api=$env:API_IMAGE
          kubectl rollout status deployment/stiction-api --timeout=300s

      - name: Deploy Streamlit image
        shell: pwsh
        run: |
          Write-Host "Deploying $env:FRONTEND_IMAGE"
          kubectl set image deployment/stiction-frontend stiction-frontend=$env:FRONTEND_IMAGE
          kubectl rollout status deployment/stiction-frontend --timeout=300s

      - name: Verify deployment
        shell: pwsh
        run: |
          Write-Host "Deployments:"
          kubectl get deployments

          Write-Host "Pods:"
          kubectl get pods

          Write-Host "Services:"
          kubectl get services

          Write-Host "API image:"
          kubectl get deployment stiction-api -o jsonpath="{.spec.template.spec.containers[0].image}"
          Write-Host ""

          Write-Host "Frontend image:"
          kubectl get deployment stiction-frontend -o jsonpath="{.spec.template.spec.containers[0].image}"
          Write-Host ""

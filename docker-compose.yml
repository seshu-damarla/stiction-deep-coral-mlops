services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api

    image: stiction-deep-coral-api:v1

    ports:
      - "8001:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend

    image: stiction-deep-coral-frontend:v1

    ports:
      - "8501:8501"

    environment:
      FASTAPI_URL: "http://api:8000"

    depends_on:
      api:
        condition: service_healthy